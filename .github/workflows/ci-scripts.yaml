name: CI for all Python scripts

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  test-all-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run all Python scripts in the repository
        shell: bash
        run: |
          set -u
          failed=0
          ignored=0
          total=0
          failures=()
          ignored_list=()

          # Provide default stdin in case a script calls input()
          dummy_input="$(printf '1\n2\n3\n4\n5\ntest\n')"

          while IFS= read -r -d '' script; do
            total=$((total + 1))
            script_dir="$(dirname "$script")"
            script_name="$(basename "$script")"

            echo "=========================================="
            echo "[$total] Testing: $script"
            echo "=========================================="

            if (
              cd "$script_dir" &&
              PYTHONPATH="$script_dir:${PYTHONPATH:-}" \
              timeout 15s python3 -B "$script_name" <<< "$dummy_input"
            ); then
              echo "PASS: $script"
            else
              exit_code=$?
              if grep -q "# ci: allow-fail" "$script"; then
                echo "IGNORED (expected failure, exit code $exit_code): $script"
                ignored=$((ignored + 1))
                ignored_list+=("[$total] (code $exit_code) $script")
              else
                echo "FAIL (exit code $exit_code): $script"
                failed=$((failed + 1))
                failures+=("[$total] (code $exit_code) $script")
              fi
            fi
          done < <(find . -type f -name "*.py" \
            ! -path "./.git/*" \
            ! -path "*/__pycache__/*" \
            ! -path "*/.venv/*" \
            ! -path "*/venv/*" \
            -print0 | sort -z)

          passed=$((total - failed - ignored))

          echo ""
          echo "Summary: $passed passed, $ignored ignored (expected), $failed failed (total: $total)."

          if [ "${#ignored_list[@]}" -gt 0 ]; then
            echo ""
            echo "Ignored scripts (# ci: allow-fail):"
            printf '  - %s\n' "${ignored_list[@]}"
          fi

          if [ "${#failures[@]}" -gt 0 ]; then
            echo ""
            echo "Failed scripts:"
            printf '  - %s\n' "${failures[@]}"
            exit 1
          fi
